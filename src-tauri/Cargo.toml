[package]
name = "quick-video-maker"
version = "0.0.0"
description = "QuickVideoMaker desktop application"
authors = ["QuickVideoMaker contributors"]
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "quick_video_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quick-video-maker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
c2pa = { version = "0.90.16", default-features = false, features = ["file_io", "rust_native_crypto"] }
regex = "1.11"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
